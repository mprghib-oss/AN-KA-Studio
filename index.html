<!DOCTYPE html>

<head>

  <meta name="description" content="AN-KA Studio — Architecture, interiors, landscape and planning portfolio.">
  <meta name="theme-color" content="#f7f7f5">
  <title>AN-KA — Architecture & Interior Design</title>
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="AN-KA home">
  <img src="assets/logo.png" alt="AN-KA Studio">
</a>
    <nav class="desktop-nav" aria-label="Primary navigation">
      <a class="active" href="index.html">WORK</a>
      <a href="about.html">ABOUT</a>
      <a href="contact.html">CONTACT</a>
    </nav>
    <button class="search-toggle" type="button" aria-label="Open search">SEARCH <span>⌕</span></button>
    <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false">MENU</button>
  </header>

  <div class="mobile-menu" aria-hidden="true">
    <button class="menu-close" type="button" aria-label="Close menu">CLOSE</button>
    <nav>
      <a href="index.html">WORK</a>
      <a href="about.html">ABOUT</a>
      <a href="contact.html">CONTACT</a>
    </nav>
  </div>

  <section class="search-panel" aria-hidden="true">
    <div class="search-inner">
      <label for="project-search">SEARCH PROJECTS</label>
      <input id="project-search" type="search" placeholder="Project, location, category or year" autocomplete="off">
      <button type="button" class="search-close">CLOSE</button>
    </div>
  </section>

  <main>
    <section class="portfolio-intro">
      <div class="category-filter" aria-label="Project categories">
        <button class="filter active" data-filter="All">ALL</button>
        <button class="filter" data-filter="Architecture">ARCHITECTURE</button>
        <button class="filter" data-filter="Interiors">INTERIORS</button>
        <button class="filter" data-filter="Landscape">LANDSCAPE</button>
        <button class="filter" data-filter="Planning">PLANNING</button>
      </div>
    </section>

    <section id="project-list" class="project-list" aria-label="Projects"></section>
  </main>

  <footer class="site-footer">
    <div>
      <strong>AN-KA STUDIO</strong>
      <span>© 2026 ALL RIGHTS RESERVED</span>
    </div>
    <span>INDONESIA</span>
    <div class="footer-links">
      <a href="#" aria-label="Instagram">INSTAGRAM</a>
      <a href="#" aria-label="LinkedIn">LINKEDIN</a>

  <script src="js/projects.js"></script>
  <script src="js/main.js"></script>
